# Publishes to RubyGems when a version tag (v0.1.0, v0.1.0.beta2) is pushed.
# No API key: RubyGems trusts this workflow (trusted publishing), configured
# on rubygems.org for owner ZapSMTP, repository zapsmtp-ruby, workflow
# publish.yml, environment rubygems.
#
# The full test suite needs the shared conformance cases and spec of the
# ZapSMTP SDK monorepo and runs there before a release is exported here; this
# workflow checks the built gem itself.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    env:
      # the RubyGems.org account that owns the gem (its immutable ID, as a string): a
      # first push must name it
      RUBYGEMS_OWNER: "255236"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Tag matches the gem version
        run: |
          v=$(ruby -Ilib -e 'require "zapsmtp/version"; print ZapSMTP::VERSION')
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Build, install and load the gem
        run: |
          gem build zapsmtp.gemspec
          gem install --local ./zapsmtp-*.gem
          cd /tmp && ruby -e 'require "zapsmtp"; ZapSMTP::Client.new(api_key: "zap_test"); puts ZapSMTP::VERSION'
      - name: Exchange the GitHub OIDC token for a short-lived RubyGems key
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          body=$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER" '{jwt: $jwt, owner: $owner}')
          res=$(curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" -d "$body")
          key=$(echo "$res" | jq -r '.rubygems_api_key // empty')
          [ -n "$key" ] || { echo "exchange failed: $(echo "$res" | jq -c 'del(.rubygems_api_key)' 2>/dev/null || echo "$res")"; exit 1; }
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - run: gem push zapsmtp-*.gem
